<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="de">
<body>
<div layout:fragment="page-header" class="header-wrapper">

    <a th:if="${not #lists.isEmpty(expeditions)}"
       th:href="@{/expedition/overview/{id}(id=${expeditions[0].id})}"
       class="banner-link">

        <div class="summer-header">
            <div class="weather-float" th:if="${!expeditions[0].typicalWeather.isEmpty()}">
                <span class="weather-emoji"
                      th:text="${expeditions[0].typicalWeather.iterator().next().emoji}">🌤️</span>
            </div>

            <div class="banner-text">
                <h2>Active Adventure:</h2>
                <h1 th:text="${expeditions[0].name}">Summer Mornings</h1>
                <p th:text="${expeditions[0].startDate} + ' to ' + ${expeditions[0].endDate}"></p>
            </div>
        </div>
    </a>

    <div th:if="${#lists.isEmpty(expeditions)}" class="summer-header">
        <div class="banner-text">
            <h2>Welcome!</h2>
            <h1>Create your first Expedition</h1>
        </div>
    </div>
</div>

<div layout:fragment="page-content">
    <div th:if="${currentExpedition != null}" class="dashboard-grid">
        <div th:each="idea : ${ideas}" class="polaroid-card">
            <div class="photo-frame">
                <img th:if="${idea.photoPath != null}"
                     th:src="@{'/uploads/' + ${idea.photoPath}}"
                     alt="Activity Photo">
                <div th:if="${idea.photoPath == null}" class="photo-placeholder">
                    <span>📷 No Photo</span>
                </div>
            </div>
            <div class="card-text">
                <h3 th:text="${idea.title}">Title</h3>
                <p class="location" th:if="${idea.place != null}" th:text="'📍 ' + ${idea.place}"></p>
            </div>
        </div>
    </div>

    <div th:if="${currentExpedition == null}" class="empty-state">
        <p>No active expedition found for today.</p>
        <p>Check your <strong>Period Overview</strong> to see upcoming trips!</p>
    </div>
</div>

<div layout:fragment="page-footer">
    <div th:replace="~{fragments/actions :: bottom-buttons}"></div>
</div>

</body>
</html>
