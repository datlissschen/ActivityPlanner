<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="de">
<body>
<div layout:fragment="page-header" class="header-wrapper">

    <a th:if="${currentExpedition != null}"
       th:href="@{/expedition/overview/{id}(id=${currentExpedition.id})}"
       class="banner-link">

        <div class="summer-header">
            <div class="weather-float" id="weather-banner"
                 th:if="${currentExpedition != null and not #sets.isEmpty(currentExpedition.typicalWeather)}">

                <input type="hidden" id="emoji-list-data"
                       th:value="${currentExpedition.getWeatherEmojisString()}" />

                <span class="weather-emoji" id="emoji-display"
                      th:text="${currentExpedition.typicalWeather.iterator().next().emoji}">🌤️</span>
            </div>

            <div class="banner-text">
                <h2>Active Adventure:</h2>
                <h1 th:text="${currentExpedition.name}">Summer Mornings</h1>
                <p th:text="${#temporals.format(currentExpedition.startDate, 'dd.MM')} + ' to ' + ${#temporals.format(currentExpedition.endDate, 'dd.MM')}"></p>
            </div>
        </div>
    </a>

    <div th:if="${currentExpedition == null}" class="summer-header">
        <div class="banner-text">
            <h2>Welcome!</h2>
            <h1>Create your first Expedition</h1>
        </div>
    </div>
</div>

<div layout:fragment="page-content">
    <div th:if="${message}" class="alert-success"
         style="background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 20px;">
        <span th:text="${message}"></span>
    </div>

    <div th:if="${error}" class="alert-error"
         style="background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 20px;">
        <span th:text="${error}"></span>
    </div>
    <div th:if="${currentExpedition != null}">
        <div class="polaroid-grid">
            <div th:each="idea : ${ideas}" class="polaroid">

                <a th:href="@{'/idea/edit/' + ${idea.id}}" class="polaroid-link">
                    <div class="photo-container">
                        <img th:if="${idea.photoPath != null}"
                             th:src="@{'/uploads/' + ${idea.photoPath}}"
                             alt="Idea Photo">
                        <div th:if="${idea.photoPath == null}" class="no-photo">
                            <span>📷 No Photo</span>
                        </div>
                    </div>

                    <div class="polaroid-caption">
                        <h3 th:text="${idea.title}">Title</h3>

                        <p th:if="${idea.place != null and idea.place != ''}" th:text="'📍 ' + ${idea.place}"></p>

                        <p th:if="${idea.startTime != null and idea.endTime != null}" class="time-range">
                            🕒
                            <span th:text="${#temporals.format(idea.startTime, 'HH:mm')}">12:00</span>
                            -
                            <span th:text="${#temporals.format(idea.endTime, 'HH:mm')}">14:00</span>
                        </p>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <div th:if="${currentExpedition == null}" class="empty-state">
        <p>No active expedition today. Time to plan a new one!</p>
    </div>
</div>

<div layout:fragment="page-footer">

    <div th:replace="~{fragments/actions :: bottom-buttons}"></div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                const dataInput = document.getElementById('emoji-list-data');
                const emojiDisplay = document.getElementById('emoji-display');

                if (dataInput && emojiDisplay) {
                    const emojisRaw = dataInput.value;
                    if (emojisRaw) {
                        const emojiList = emojisRaw.split(',');

                        if (emojiList.length > 1) {
                            let currentIndex = 0;
                            setInterval(() => {
                                currentIndex = (currentIndex + 1) % emojiList.length;

                                emojiDisplay.style.opacity = 0;
                                setTimeout(() => {
                                    emojiDisplay.textContent = emojiList[currentIndex];
                                    emojiDisplay.style.opacity = 1;
                                }, 300);
                            }, 3000);
                        }
                    }
                }
            });
        </script>
    </th:block>
</div>
</body>
</html>
