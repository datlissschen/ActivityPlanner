<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>

<div layout:fragment="page-header" class="header-wrapper">

    <div th:each="exp, iterStat : ${expeditions}"
         th:if="${iterStat.first}"
         class="summer-header">

        <div class="weather-float">
            <span class="weather-emoji"
                  th:if="${!exp.typicalWeather.isEmpty()}"
                  th:text="${exp.typicalWeather.iterator().next().emoji}">🌤️</span>
        </div>

        <div class="banner-text">
            <h2>Active Adventure:</h2>
            <h1 th:text="${exp.name}">Summer Mornings</h1>
            <p th:text="${exp.startDate} + ' to ' + ${exp.endDate}"></p>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(expeditions)}" class="summer-header">
        <div class="banner-text">
            <h2>Welcome!</h2>
            <h1>Create your first Expedition</h1>
        </div>
    </div>

</div>

<div layout:fragment="page-content" class="cards-container">
    <div class="idea-card card-green">
        <img th:src="@{/images/icon-calendar-check.png}" class="card-check-btn" alt="check">
        <div class="card-icon">🥾</div>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    </div>

</div>

<div layout:fragment="page-footer">
    <div th:replace="~{fragments/actions :: bottom-buttons}"></div>
</div>

</body>
</html>
