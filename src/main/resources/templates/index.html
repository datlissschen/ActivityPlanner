<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="de">
<body>
<div layout:fragment="page-header" class="header-wrapper">

    <a th:if="${currentExpedition != null}"
       th:href="@{/expedition/overview/{id}(id=${currentExpedition.id})}"
       class="banner-link">

        <div class="summer-header">
            <div class="weather-float" id="weather-banner"
                 th:if="${currentExpedition != null and not #sets.isEmpty(currentExpedition.typicalWeather)}">

                <input type="hidden" id="emoji-list-data"
                       th:value="${currentExpedition.getWeatherEmojisString()}" />

                <span class="weather-emoji" id="emoji-display"
                      th:text="${currentExpedition.typicalWeather.iterator().next().emoji}">🌤️</span>
            </div>

            <div class="banner-text">
                <h2>Active Adventure:</h2>
                <h1 th:text="${currentExpedition.name}">Summer Mornings</h1>
                <p th:text="${#temporals.format(currentExpedition.startDate, 'dd.MM')} + ' to ' + ${#temporals.format(currentExpedition.endDate, 'dd.MM')}"></p>
            </div>
        </div>
    </a>

    <div th:if="${currentExpedition == null}" class="summer-header">
        <div class="banner-text">
            <h2>Welcome!</h2>
            <h1>Create your first Expedition</h1>
        </div>
    </div>
</div>

<div layout:fragment="page-content">
    <h2 class="hand-drawn-title" th:if="${currentExpedition != null}"
        th:text="${currentExpedition.name}">Current Expedition</h2>

    <div th:if="${#lists.isEmpty(ideas)}" class="empty-state">
        <p>No ideas scheduled for today. Time to plan an adventure!</p>
    </div>

    <div class="slider-container" th:if="${not #lists.isEmpty(ideas)}">
        <button class="nav-arrow left" id="leftArrow" onclick="scrollGrid(-1)">❮</button>

        <div class="polaroid-viewport" id="viewport">
            <div class="polaroid-grid">
                <div th:each="idea : ${ideas}"
                     class="polaroid"
                     th:classappend="${idea.photoPath == null} ? 'compact' : ''">

                    <div class="time-marker" th:attr="data-time=${#temporals.format(idea.startTime, 'HH:mm')}"></div>

                    <a th:href="@{/idea/edit/{id}(id=${idea.id})}" class="polaroid-link">
                        <div class="photo-container" th:if="${idea.photoPath != null}">
                            <img th:src="@{'/uploads/' + ${idea.photoPath}}" alt="Idea Photo">
                        </div>
                        <div class="polaroid-caption">
                            <h3 th:text="${idea.title}">Title</h3>
                            <p th:if="${idea.place != null and idea.place != ''}" th:text="'📍 ' + ${idea.place}"></p>
                            <p th:if="${idea.startTime != null}" class="time-range">
                                🕒 <span th:text="${#temporals.format(idea.startTime, 'HH:mm')}"></span>
                                <small th:text="'(' + ${idea.getDurationFormatted()} + ')'"></small>
                            </p>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <button class="nav-arrow right" id="rightArrow" onclick="scrollGrid(1)">❯</button>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        // --- 1. Horizontal Slider Logic ---
        function scrollGrid(direction) {
            const viewport = document.getElementById('viewport');
            const scrollAmount = viewport.clientWidth * 0.8;
            viewport.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        // --- 2. Weather Emoji Logic ---
        document.addEventListener('DOMContentLoaded', function() {
            const dataInput = document.getElementById('emoji-list-data');
            const emojiDisplay = document.getElementById('emoji-display');
            if (dataInput && emojiDisplay) {
                const emojiList = dataInput.value.split(',');
                if (emojiList.length > 1) {
                    let currentIndex = 0;
                    setInterval(() => {
                        currentIndex = (currentIndex + 1) % emojiList.length;
                        emojiDisplay.style.opacity = 0;
                        setTimeout(() => {
                            emojiDisplay.textContent = emojiList[currentIndex];
                            emojiDisplay.style.opacity = 1;
                        }, 300);
                    }, 3000);
                }
            }
        });
    </script>
</th:block>

<div layout:fragment="page-footer">

    <div th:replace="~{fragments/actions :: bottom-buttons}"></div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                const dataInput = document.getElementById('emoji-list-data');
                const emojiDisplay = document.getElementById('emoji-display');

                if (dataInput && emojiDisplay) {
                    const emojisRaw = dataInput.value;
                    if (emojisRaw) {
                        const emojiList = emojisRaw.split(',');

                        if (emojiList.length > 1) {
                            let currentIndex = 0;
                            setInterval(() => {
                                currentIndex = (currentIndex + 1) % emojiList.length;

                                emojiDisplay.style.opacity = 0;
                                setTimeout(() => {
                                    emojiDisplay.textContent = emojiList[currentIndex];
                                    emojiDisplay.style.opacity = 1;
                                }, 300);
                            }, 3000);
                        }
                    }
                }
            });
        </script>
    </th:block>
</div>
</body>
</html>
