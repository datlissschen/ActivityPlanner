<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="de">
<body>

<div layout:fragment="page-content" class="form-container">
    <div class="form-paper pink-paper">
        <h1 class="hand-drawn-title">Add a New Activity Idea</h1>

        <form th:action="@{/idea/save}" th:object="${idea}" method="post" enctype="multipart/form-data">

            <div class="input-group">
                <label for="title">Title:</label>
                <input type="text" th:field="*{title}" id="title" placeholder="e.g., Midnight Hike" required />
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="place">Place/Location:</label>
                    <input type="text" th:field="*{place}" id="place" placeholder="e.g., Black Forest" />
                </div>
                <div class="input-group">
                    <label for="startTime">Start Time:</label>
                    <input type="datetime-local" th:field="*{startTime}" id="startTime" />
                </div>
                <div class="input-group">
                    <label for="endTime">End Time:</label>
                    <input type="datetime-local" th:field="*{endTime}" id="endTime" />

                </div>
            </div>

            <div class="input-group">
                <label for="description">Description:</label>
                <textarea th:field="*{description}" id="description" placeholder="What is the plan?" rows="4"></textarea>
            </div>

            <div class="input-group">
                <label>Belongs to Expeditions:</label>
                <div class="station-selector">
                    <div th:each="exp : ${expeditions}" class="station-checkbox">
                        <input type="checkbox"
                               th:field="*{expeditions}"
                               th:value="${exp.id}"
                               th:id="'exp-' + ${exp.id}" />
                        <label th:for="'exp-' + ${exp.id}" th:text="${exp.name}"></label>
                    </div>
                    <p th:if="${#lists.isEmpty(expeditions)}" style="font-size: 0.8rem; color: #666;">
                        No expeditions found. Create one first!
                    </p>
                </div>
            </div>

            <div class="input-group">
                <label for="photoFile">Upload a Photo:</label>
                <input type="file" name="photoFile" id="photoFile" accept="image/*" class="file-input" />
            </div>

            <div class="form-actions">
                <button type="submit" class="pill-btn">✨ Add Idea</button>
                <a th:href="@{/}" class="pill-btn secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
