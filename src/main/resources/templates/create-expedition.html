<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>

<div layout:fragment="page-content" class="form-container">
    <div class="form-paper">
        <h1 class="hand-drawn-title">Plan a New Expedition</h1>

        <form th:action="@{/expedition/save}" th:object="${expedition}" method="post">
            <div class="input-group">
                <label>Expedition Name:</label>
                <input type="text" th:field="*{expeditionName}" placeholder="e.g., Winter Mornings" required />
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Start Date:</label>
                    <input type="date" th:field="*{startDate}" required />
                </div>
                <div class="input-group">
                    <label>End Date:</label>
                    <input type="date" th:field="*{endDate}" required />
                </div>
            </div>

            <div class="input-group">
                <label>Wished Weather (Multiple Choice):</label>
                <div class="weather-grid">
                    <div th:each="type : ${weatherTypes}" class="weather-option">
                        <input type="checkbox" th:field="*{typicalWeather}" th:value="${type}" th:id="${type}" />
                        <label th:for="${type}" th:text="${type.emoji + ' ' + type.displayName}"></label>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="pill-btn">💾 Save Expedition</button>
                <a th:href="@{/}" class="pill-btn secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
