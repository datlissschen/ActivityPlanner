<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="de">
<body>

<div layout:fragment="page-content" class="form-container">
    <div class="form-paper">
        <h1 class="hand-drawn-title">Expedition Overview</h1>

        <form th:action="@{/expedition/save}" th:object="${expedition}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="input-group">
                <label>Expedition Name:</label>
                <input type="text" th:field="*{name}" required />
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Start Date:</label>
                    <input type="date"
                           th:value="${expedition.startDate}"
                           name="startDate"
                           id="startDate"
                           required />
                </div>
                <div class="input-group">
                    <label>End Date:</label>
                    <input type="date"
                           th:value="${expedition.endDate}"
                           name="endDate"
                           id="endDate"
                           required />
                </div>
            </div>

            <div class="input-group">
                <label>Expedition Description:</label>
                <textarea th:field="*{expeditionDescription}"
                          placeholder="Tell the story of this adventure..."
                          rows="5"></textarea>
            </div>

            <div class="input-group">
                <label>Weather Summary:</label>
                <div class="weather-grid">
                    <div th:each="type : ${weatherTypes}" class="weather-option">
                        <input type="checkbox" th:field="*{typicalWeather}" th:value="${type}" th:id="${type}" />
                        <label th:for="${type}" th:text="${type.emoji + ' ' + type.displayName}"></label>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="pill-btn">💾 Save Changes</button>
                <a th:href="@{/}" class="pill-btn secondary">Back</a>
            </div>
        </form>

        <hr style="margin: 30px 0; border: 1px dashed var(--color-ink); opacity: 0.3;">
        <form th:action="@{/expedition/delete/{id}(id=${expedition.id})}" method="post">
            <button type="submit" class="pill-btn delete-btn"
                    onclick="return confirm('Are you sure you want to delete this adventure?')">
                🗑️ Delete
            </button>
        </form>
    </div>
</div>

</body>
</html>
