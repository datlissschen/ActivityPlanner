<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="de">
<body>

<div layout:fragment="page-content" class="form-container">
    <div class="form-paper pink-paper">
        <h1 class="hand-drawn-title">Edit Idea</h1>

        <form th:action="@{/idea/update}" th:object="${idea}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{photoPath}" />
            <input type="hidden" th:field="*{googleEventId}" />
            <input type="hidden" th:field="*{lastSyncedAt}" />

            <div class="input-group">
                <label for="title">Title:</label>
                <input type="text" th:field="*{title}" id="title" required />
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Place:</label>
                    <label>
                        <input type="text" th:field="*{place}" />
                    </label>
                </div>
                <div class="input-group">
                    <label for="startTime">Start Time:</label>
                    <input type="datetime-local" th:field="*{startTime}" id="startTime" />
                </div>
                <div class="input-group">
                    <label for="endTime">End Time:</label>
                    <input type="datetime-local" th:field="*{endTime}" id="endTime" />
                </div>

            </div>

            <div class="input-group">
                <label>Description:</label>
                <label>
                    <textarea th:field="*{description}" rows="5"></textarea>
                </label>
            </div>

            <div class="input-group">
                <label>Belongs to Expeditions:</label>
                <div class="station-selector">
                    <div th:each="exp : ${expeditions}" class="station-checkbox">
                        <label>
                            <input type="checkbox"
                                   th:field="*{expeditions}"
                                   th:value="${exp.id}"
                                   th:id="'exp-' + ${exp.id}" />
                        </label>

                        <label th:for="'exp-' + ${exp.id}" th:text="${exp.name}"></label>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Update Photo (Optional):</label>
                <input type="file" name="photoFile" accept="image/*" class="file-input" />
            </div>

            <div class="sync-info" th:if="${idea.lastSyncedAt != null}"
                 style="margin-top: 20px; font-size: 0.9rem; color: #666; font-style: italic;">
                <p>
                    📅 Last synced with Google Calendar:
                    <span th:text="${#temporals.format(idea.lastSyncedAt, 'dd.MM.yyyy HH:mm')}"></span>
                </p>
            </div>

            <div class="sync-info" th:if="${idea.lastSyncedAt == null}"
                 style="margin-top: 20px; font-size: 0.9rem; color: #999;">
                <p>☁️ This idea has not been synced to Google Calendar yet.</p>
            </div>

            <div class="form-actions">
                <button type="submit" class="pill-btn">💾 Save Changes</button>
                <button type="submit" form="deleteForm" class="pill-btn danger">🗑️ Delete</button>
                <a th:href="@{/}" class="pill-btn secondary">Back</a>
            </div>
        </form>

        <form id="deleteForm" th:action="@{'/idea/delete/' + ${idea.id}}" method="post"
              style="display: none;" onsubmit="return confirm('Really delete this idea?');">
        </form>
    </div>
</div>

</body>
</html>
