<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="de">
<body>

<div layout:fragment="page-content">
    <div class="list-header">
        <h1 class="hand-drawn-title">Inspiration Gallery</h1>

        <a th:href="@{/}" class="pill-btn secondary">⬅ Back to Home</a>
    </div>

    <form th:action="@{/idea/list}" method="get" class="search-container">
        <label>
            <input type="text" name="search" th:value="${searchQuery}"
                   placeholder="Search by title, place, or info..." class="search-input">
        </label>
        <button type="submit" class="pill-btn">🔍 Search</button>
        <a th:href="@{/idea/list}" class="pill-btn secondary" th:if="${searchQuery}">Clear</a>
    </form>
    <div class="polaroid-grid">
        <div th:each="idea : ${ideas}" class="polaroid">
            <a th:href="@{'/idea/edit/' + ${idea.id}}" class="polaroid-link">
                <div class="photo-container">
                    <img th:if="${idea.photoPath != null}"
                         th:src="@{'/uploads/' + ${idea.photoPath}}"
                         alt="Idea Photo">
                    <div th:if="${idea.photoPath == null}" class="no-photo">
                        <span>📷 No Photo</span>
                    </div>
                </div>

                <div class="polaroid-caption">
                    <h3 th:text="${idea.title}">Title</h3>
                    <p th:if="${idea.place != null}" th:text="'📍 ' + ${idea.place}"></p>

                    <div class="card-tags">
                        <span th:each="exp : ${idea.expeditions}"
                              th:text="${exp.name}" class="mini-tag"></span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(ideas)}" class="empty-state">
        <p>Your gallery is empty. Start by adding a new activity idea!</p>
        <a th:href="@{/idea/new}" class="pill-btn">⊕ Add Idea</a>
    </div>

    <div class="form-actions" style="margin: 40px 0;">
        <a th:href="@{/}" class="pill-btn secondary">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
